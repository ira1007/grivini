<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Grivini master logo</title>
  <desc id="desc">Gold Grivini monogram and wordmark on a transparent background.</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="22%" stop-color="#E6C15A"/>
      <stop offset="52%" stop-color="#B98522"/>
      <stop offset="76%" stop-color="#F1D77B"/>
      <stop offset="100%" stop-color="#9A6717"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Transparent canvas -->

  <!-- Monogram frame -->
  <rect x="380" y="120" width="440" height="560" rx="210"
        fill="none" stroke="url(#gold)" stroke-width="15"
        filter="url(#softShadow)"/>

  <!-- Stylized G -->
  <text x="600" y="575"
        text-anchor="middle"
        font-family="Cinzel, 'Times New Roman', Georgia, serif"
        font-size="470"
        font-weight="500"
        fill="url(#gold)"
        filter="url(#softShadow)">G</text>

  <!-- Diamond sparkle -->
  <path d="M600 330 L618 365 L653 383 L618 401 L600 436 L582 401 L547 383 L582 365 Z"
        fill="url(#gold)"/>

  <!-- Wordmark -->
  <text x="600" y="870"
        text-anchor="middle"
        font-family="Cinzel, 'Times New Roman', Georgia, serif"
        font-size="145"
        font-weight="500"
        letter-spacing="34"
        fill="url(#gold)"
        filter="url(#softShadow)">GRIVINI</text>

  <!-- Divider -->
  <line x1="305" y1="970" x2="555" y2="970" stroke="url(#gold)" stroke-width="5"/>
  <line x1="645" y1="970" x2="895" y2="970" stroke="url(#gold)" stroke-width="5"/>
  <path d="M600 942 L628 970 L600 998 L572 970 Z" fill="url(#gold)"/>
</svg>
